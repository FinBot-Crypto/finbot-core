name: Deploy finbot-core

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Sync Core
        run: |
          set -e
          TARGET=/root/finbot-core
          mkdir -p "$TARGET"
          rsync -a --delete --exclude .git --exclude .env --exclude .venv --exclude node_modules --exclude dist "$GITHUB_WORKSPACE/" "$TARGET/"
      - name: Start infrastructure
        working-directory: /root/finbot-core
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d
      - name: Apply Core migrations
        working-directory: /root/finbot-core
        run: |
          set -e
          DB_USER=$(sed -n 's/^DB_USER=//p' .env)
          DB_NAME=$(sed -n 's/^DB_NAME=//p' .env)
          for migration in scripts/migrations/*.sql; do
            docker exec -i crypto-postgres psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" < "$migration"
          done
      - name: Build and start Core
        working-directory: /root/finbot-core
        run: docker compose --env-file .env up -d --build
      - name: Health check
        run: |
          docker ps --filter name=fb-core --format '{{.Names}} {{.Status}}'
          curl -sf http://localhost:8000/api/status

