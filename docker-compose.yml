x-common-env: &common-env
  TZ: ${TZ:-America/Sao_Paulo}
  NATS_URL: ${NATS_URL:-nats://crypto-nats:4222}
  DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@crypto-postgres:5432/${DB_NAME}
  BINANCE_API_KEY: ${BINANCE_API_KEY}
  BINANCE_API_SECRET: ${BINANCE_API_SECRET}
  DRY_RUN: ${DRY_RUN:-false}

services:
  fb-core-exec:
    build:
      context: .
      dockerfile: services/fb-core-exec/Dockerfile
    container_name: fb-core-exec
    restart: unless-stopped
    environment:
      <<: *common-env
      MAX_POSITIONS: ${MAX_POSITIONS:-20}
      MAX_ORDER_NOTIONAL_USDT: ${MAX_ORDER_NOTIONAL_USDT:-25}
    networks: [crypto-network]

  fb-core-monitor:
    build:
      context: .
      dockerfile: services/fb-core-monitor/Dockerfile
    container_name: fb-core-monitor
    restart: unless-stopped
    environment:
      <<: *common-env
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-10}
      MAX_HOLD_HOURS: ${MAX_HOLD_HOURS:-24}
    networks: [crypto-network]

  fb-core-dashboard:
    build:
      context: .
      dockerfile: services/fb-core-dashboard/Dockerfile
    container_name: fb-core-dashboard
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      <<: *common-env
      MAX_HOLD_HOURS: ${MAX_HOLD_HOURS:-24}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [crypto-network]

networks:
  crypto-network:
    external: true
