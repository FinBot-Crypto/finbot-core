# NATS Server Configuration — Finanças Crypto Bot
# Ref: https://docs.nats.io/running-a-nats-service/configuration

# Server
listen: 0.0.0.0:4222
max_payload: 1MB

# HTTP Monitoring
http_port: 8222

# JetStream (mensageria efêmera + KV store)
# Limite global do servidor; retenção por stream é configurada no fb-market-selection.
jetstream {
  store_dir: /data
  max_mem: 128MB
  max_file: 1GB
}
